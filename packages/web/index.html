<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>piconic edit</title>
    <script>
      // Applies the stored appearance before the first paint, so the page does not flash.
      // main.ts validates it again (appearance.ts); this only has to never throw.
      try {
        var stored = JSON.parse(localStorage.getItem('pedit:appearance') || 'null')
        var root = document.documentElement
        if (stored && typeof stored === 'object') {
          if (typeof stored.fontSize === 'number' && stored.fontSize >= 12 && stored.fontSize <= 24)
            root.style.setProperty('--editor-font-size', stored.fontSize + 'px')
          if (typeof stored.lineHeight === 'number' && stored.lineHeight >= 1.2 && stored.lineHeight <= 2)
            root.style.setProperty('--editor-line-height', String(stored.lineHeight))
        }
        // The page colours of the reader's theme, as palette.ts last applied them.
        var palette = JSON.parse(localStorage.getItem('pedit:palette') || 'null')
        var names = ['--bg', '--panel', '--ink', '--muted', '--line', '--accent', '--code-bg', '--warn-bg', '--warn-ink']
        var hex = '#[0-9a-f]{6}([0-9a-f]{2})?'
        var color = new RegExp('^(' + hex + '|light-dark\\(' + hex + ', ' + hex + '\\))$')
        if (palette && typeof palette === 'object') {
          for (var i = 0; i < names.length; i++) {
            var value = palette[names[i]]
            if (typeof value === 'string' && color.test(value)) root.style.setProperty(names[i], value)
          }
          var scheme = palette['color-scheme']
          if (scheme === 'light' || scheme === 'dark' || scheme === 'light dark')
            root.style.setProperty('color-scheme', scheme)
        }
      } catch (e) {}
    </script>
    <!-- Two peers' carets in piconic green, drawn as the editor draws them. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='%2300b769'><circle cx='9' cy='6' r='5'/><rect x='7' y='6' width='4' height='24' rx='1'/><circle cx='23' cy='12' r='5'/><rect x='21' y='12' width='4' height='18' rx='1'/></g></svg>" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
