name: homebrew-formula

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
        description: Token with Contents and Pull requests write access to piconic-ai/homebrew-tap
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Published release tag (e.g. v0.0.4)

permissions:
  contents: read

concurrency:
  group: homebrew-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
      TAP_REPO: piconic-ai/homebrew-tap
    steps:
      - name: Check tap credentials and release tag
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "Set HOMEBREW_TAP_TOKEN with Contents and Pull requests write access to $TAP_REPO" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then error("Release is still a draft") else . end'
          mkdir -p "$RUNNER_TEMP/homebrew-assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "pedit_${TAG}_darwin_*.tar.gz" \
            --pattern "pedit_${TAG}_linux_*.tar.gz" --pattern checksums.txt \
            --dir "$RUNNER_TEMP/homebrew-assets"
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: piconic-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: main
          path: homebrew-tap
          persist-credentials: false
      - name: Update Formula release metadata
        run: |
          set -euo pipefail
          python3 scripts/update-homebrew-formula.py homebrew-tap/Formula/pedit.rb \
            "$TAG" "$RUNNER_TEMP/homebrew-assets"
          ruby -c homebrew-tap/Formula/pedit.rb
          git -C homebrew-tap diff --check
      - name: Push update and open a pull request
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formula already matches this release, or a newer release is installed in the tap"
            exit 0
          fi
          branch="pedit-${TAG}"
          gh auth setup-git
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/pedit.rb
          git commit -m "Update pedit to ${TAG#v}"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --repo "$TAP_REPO" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            printf 'Update pedit to %s.\n\nAll four archive SHA-256 values were calculated from the published [release assets](https://github.com/%s/releases/tag/%s) and verified against checksums.txt.\n' \
              "${TAG#v}" "$GITHUB_REPOSITORY" "$TAG" > "$RUNNER_TEMP/homebrew-pr.md"
            gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
              --title "Update pedit to ${TAG#v}" --body-file "$RUNNER_TEMP/homebrew-pr.md"
          else
            echo "Updated existing PR #$pr"
          fi
